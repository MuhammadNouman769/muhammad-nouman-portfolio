# /etc/nginx/sites-available/portfolio  (then: ln -s into sites-enabled, certbot --nginx -d yourdomain.com)
server {
    server_name yourdomain.com www.yourdomain.com;
    client_max_body_size 55m;

    location /static/ { alias /srv/portfolio/staticfiles/; expires 1y; add_header Cache-Control "public, immutable"; }
    location /media/  { alias /srv/portfolio/media/; expires 30d; }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 80;
}
