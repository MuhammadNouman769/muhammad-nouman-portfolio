{# Animated banner artwork for page heads. Needs: icon, a, b, c (three floating chip labels). Decorative only. #}
<div class="bn-art" aria-hidden="true">
  <i class="bn-orb bn-o1"></i><i class="bn-orb bn-o2"></i><i class="bn-orb bn-o3"></i>
  <div class="bn-card">
    <div class="bn-bar"><i></i><i></i><i></i></div>
    <svg class="bn-icon" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      {% if icon == 'user' %}<circle cx="24" cy="16" r="8"/><path d="M8 42c2-9 8-14 16-14s14 5 16 14"/>
      {% elif icon == 'code' %}<path d="M17 14 7 24l10 10M31 14l10 10-10 10M27 9l-6 30"/>
      {% elif icon == 'pen' %}<path d="M10 38l2-9L32 9l7 7-20 20-9 2z"/><path d="M28 13l7 7"/>
      {% elif icon == 'mail' %}<rect x="6" y="11" width="36" height="26" rx="4"/><path d="M7 14l17 13 17-13"/>
      {% elif icon == 'path' %}<circle cx="11" cy="12" r="4"/><circle cx="37" cy="24" r="4"/><circle cx="14" cy="38" r="4"/><path d="M14 14c14 0 18 4 20 8M34 27c-8 2-14 5-17 8"/>
      {% elif icon == 'stack' %}<path d="M24 6 6 15l18 9 18-9z"/><path d="M6 24l18 9 18-9M6 33l18 9 18-9"/>
      {% elif icon == 'grid' %}<rect x="7" y="7" width="14" height="14" rx="3"/><rect x="27" y="7" width="14" height="14" rx="3"/><rect x="7" y="27" width="14" height="14" rx="3"/><rect x="27" y="27" width="14" height="14" rx="3"/>
      {% else %}<path d="M24 6 8 12v11c0 10 7 17 16 20 9-3 16-10 16-20V12z"/><path d="M17 24l5 5 9-10"/>{% endif %}
    </svg>
    <b class="bn-line"></b><b class="bn-line s"></b><b class="bn-line xs"></b>
  </div>
  <span class="bn-chip c1">{{ a }}</span><span class="bn-chip c2">{{ b }}</span><span class="bn-chip c3">{{ c }}</span>
</div>
