{# Small chat robot: asks for a name and email, then subscribes the visitor to new articles and case studies. #}
<div class="bot" id="bot" data-url="{% url 'subscribers:subscribe' %}" data-owner="{{ site.owner_name }}">
  <p class="bot-bubble" id="bot-bubble" hidden>Hi! Want an email when I publish something new?</p>
  <button class="bot-fab" id="bot-fab" type="button" aria-expanded="false" aria-controls="bot-panel" aria-label="Chat with the updates robot">
    <svg class="rb" viewBox="0 0 96 120" width="72" height="90" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="rbMetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#dbe7e9"/><stop offset="1" stop-color="#9fb6ba"/></linearGradient>
        <linearGradient id="rbDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2d2a7a"/><stop offset="1" stop-color="#0b0c1f"/></linearGradient>
        <linearGradient id="rbTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7dff"/><stop offset="1" stop-color="#5b4bf5"/></linearGradient>
        <radialGradient id="rbGlow"><stop offset="0" stop-color="#b6fff3"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>
        <filter id="rbBlur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
      </defs>
      <ellipse class="rb-shadow" cx="48" cy="115" rx="26" ry="4" fill="#031a1f" opacity=".28"/>
      <line x1="48" y1="9" x2="48" y2="20" stroke="#7d979c" stroke-width="3" stroke-linecap="round"/>
      <circle class="bot-led" cx="48" cy="7" r="5" fill="#f5b642"/><circle cx="46.4" cy="5.4" r="1.6" fill="#fff" opacity=".85"/>
      <rect x="13" y="40" width="8" height="18" rx="4" fill="url(#rbTeal)"/><rect x="75" y="40" width="8" height="18" rx="4" fill="url(#rbTeal)"/>
      <rect x="19" y="18" width="58" height="48" rx="18" fill="url(#rbMetal)" stroke="#8aa5a9" stroke-width="1.2"/>
      <rect x="25" y="26" width="46" height="32" rx="12" fill="url(#rbDark)"/>
      <path d="M30 31c7-3 21-3 30-1" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2" stroke-linecap="round"/>
      <g class="bot-eyes">
        <ellipse cx="38" cy="41" rx="7" ry="8" fill="#2dd4bf" opacity=".5" filter="url(#rbBlur)"/><ellipse cx="58" cy="41" rx="7" ry="8" fill="#2dd4bf" opacity=".5" filter="url(#rbBlur)"/>
        <ellipse cx="38" cy="41" rx="4.6" ry="5.8" fill="#7ff5e3"/><ellipse cx="58" cy="41" rx="4.6" ry="5.8" fill="#7ff5e3"/>
        <circle cx="39.4" cy="39" r="1.5" fill="#fff"/><circle cx="59.4" cy="39" r="1.5" fill="#fff"/>
      </g>
      <path d="M41 51.5c4.5 3.4 9.5 3.4 14 0" fill="none" stroke="#7ff5e3" stroke-width="2.2" stroke-linecap="round"/>
      <rect x="40" y="66" width="16" height="7" rx="2" fill="#486b72"/><path d="M40 69.5h16" stroke="#2c4c52" stroke-width="1.2"/>
      <rect x="11" y="77" width="10" height="24" rx="5" fill="url(#rbMetal)" stroke="#8aa5a9"/><circle cx="16" cy="103" r="5" fill="url(#rbTeal)"/>
      <g class="bot-arm"><rect x="75" y="77" width="10" height="24" rx="5" fill="url(#rbMetal)" stroke="#8aa5a9"/><circle cx="80" cy="103" r="5" fill="url(#rbTeal)"/></g>
      <rect x="24" y="72" width="48" height="34" rx="14" fill="url(#rbMetal)" stroke="#8aa5a9" stroke-width="1.2"/>
      <rect x="34" y="79" width="28" height="20" rx="8" fill="url(#rbDark)"/>
      <circle class="bot-core" cx="48" cy="89" r="8" fill="url(#rbGlow)"/><circle cx="48" cy="89" r="3.2" fill="#7ff5e3"/>
      <path d="M38 102h20" stroke="#8aa5a9" stroke-width="1.4" stroke-linecap="round"/>
      <rect x="30" y="105" width="15" height="9" rx="4.5" fill="#486b72"/><rect x="51" y="105" width="15" height="9" rx="4.5" fill="#486b72"/>
    </svg>
    <span class="bot-dot" aria-hidden="true"></span>
  </button>
  <section class="bot-panel" id="bot-panel" role="dialog" aria-label="Updates robot" hidden>
    <header><span class="bot-ava" aria-hidden="true"><svg viewBox="0 0 64 64" width="32" height="32"><line x1="32" y1="4" x2="32" y2="13" stroke="#cfe6e4" stroke-width="3" stroke-linecap="round"/><circle cx="32" cy="5" r="3.5" fill="#f5b642"/><rect x="7" y="28" width="6" height="13" rx="3" fill="#2dd4bf"/><rect x="51" y="28" width="6" height="13" rx="3" fill="#2dd4bf"/><rect x="11" y="13" width="42" height="38" rx="14" fill="#e8f1f2"/><rect x="16" y="19" width="32" height="24" rx="9" fill="#04161a"/><ellipse cx="25" cy="30" rx="3.6" ry="4.6" fill="#7ff5e3"/><ellipse cx="39" cy="30" rx="3.6" ry="4.6" fill="#7ff5e3"/><path d="M26 37c4 3 8 3 12 0" fill="none" stroke="#7ff5e3" stroke-width="2" stroke-linecap="round"/></svg></span>
      <span><b>Nova</b><small>Updates robot</small></span>
      <button class="bot-x" id="bot-x" type="button" aria-label="Close chat">&times;</button></header>
    <div class="bot-log" id="bot-log" aria-live="polite"></div>
    <div class="bot-quick" id="bot-quick"></div>
    <form class="bot-form" id="bot-form" autocomplete="on" novalidate>{% csrf_token %}
      <input type="text" name="website" tabindex="-1" autocomplete="off" class="bot-hp" aria-hidden="true">
      <label class="sr" for="bot-in">Your answer</label>
      <input class="bot-in" id="bot-in" type="text" maxlength="254" placeholder="Type here" disabled>
      <button class="bot-send" type="submit" aria-label="Send" disabled><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
    </form>
    <p class="bot-note">Only new articles and case studies. One click to unsubscribe.</p>
  </section>
</div>
