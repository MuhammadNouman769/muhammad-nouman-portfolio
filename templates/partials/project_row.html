{% load static %}
<li class="row" style="--h: {{ forloop.counter0|default:0 }}">
  <a class="row-link" href="{{ p.get_absolute_url }}">
    <span class="row-thumb">
      {% if p.image %}<img src="{{ p.image.url }}" alt="" loading="lazy" width="320" height="200">{% else %}<span class="mono-tile" aria-hidden="true">{{ p.short_title|slice:":2" }}</span>{% endif %}
    </span>
    <span class="row-main">
      <span class="row-title">{{ p.short_title }}</span>
      <span class="row-sub">{{ p.subtitle|default:p.summary|truncatechars:90 }}</span>
    </span>
    <span class="row-tags">{% for t in p.tags.all|slice:":4" %}<span>{{ t.name }}</span>{% endfor %}</span>
    <span class="status s-{{ p.status }}">{{ p.get_status_display }}</span>
  </a>
</li>
