<article class="bk">
  <a class="bk-link" href="{{ book.get_absolute_url }}" aria-label="{{ book.title }}">{% include 'books/_cover.html' with book=book %}</a>
  <div class="bk-info">
    <span class="bk-meta">{{ book.category|default:'Book' }} · {{ book.published_on|date:"j M Y" }}</span>
    <h2 class="bk-title"><a href="{{ book.get_absolute_url }}">{{ book.title }}</a></h2>
    <p class="bk-sum">{{ book.summary }}</p>
    <div class="bk-actions">
      <a class="btn btn-solid btn-sm" href="{{ book.get_absolute_url }}">Details</a>
      {% if book.can_read %}<a class="btn btn-ghost btn-sm" href="{% url 'books:download' book.slug %}">Download</a>
      {% elif book.is_coming_soon %}<span class="btn btn-ghost btn-sm bk-off" aria-disabled="true">Coming soon</span>
      {% else %}<span class="btn btn-ghost btn-sm bk-off" aria-disabled="true">No PDF</span>{% endif %}
    </div>
  </div>
</article>
