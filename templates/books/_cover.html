<span class="bk-cover" style="--ac:{{ book.cover_accent }}" aria-hidden="true">
  {% if book.cover_image %}<img src="{{ book.cover_image.url }}" alt="" loading="lazy" onerror="this.remove()">{% endif %}
  <span class="bk-gen"><i></i><em>{{ book.get_language_display }}</em><strong>{{ book.title }}</strong><small>{{ book.author|default:site.owner_name }}</small></span>
</span>
