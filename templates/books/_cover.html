<span class="bk-cover" style="--ac:{{ book.cover_accent }}">
  {% if book.cover_image %}<img src="{{ book.cover_image.url }}" alt="Cover of {{ book.title }}" loading="lazy">
  {% else %}<span class="bk-gen" aria-hidden="true"><small>{{ book.category }}</small><b>{{ book.title }}</b><em>{{ book.author|default:site.owner_name }}</em></span>{% endif %}
  {% if book.is_coming_soon %}<span class="bk-badge">Coming soon</span>{% endif %}
</span>
